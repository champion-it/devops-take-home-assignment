variables:
  # Huawei SWR registry
  SWR_REGISTRY: swr.ap-southeast-2.myhuaweicloud.com
  SWR_ORG: devops-demo
  SWR_REGION: ap-southeast-2
  # Override per-project in .gitlab-ci.yml if image name differs from project name.
  # e.g. demo-backend -> devops-backend  =>  set IMAGE_NAME: devops-backend
  IMAGE_NAME: $CI_PROJECT_NAME
  # Dockerfile uses BuildKit syntax (syntax=docker/dockerfile:1.7 + cache mounts).
  DOCKER_BUILDKIT: "1"
  NODE_IMAGE: node:20-alpine
  DOCKER_IMAGE: docker:24

stages:
  - install
  - lint
  - test
  - build
  - build-docker-dev
  - build-docker-prod
  - sonar
  - container-scanning

# ---------- Reusable cache for node_modules ----------
.node-cache: &node-cache
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/

# ---------- install ----------
install:
  stage: install
  image: $NODE_IMAGE
  tags:
    - docker
  only:
    - dev
    - tags
    - merge_requests
  <<: *node-cache
  script:
    - npm ci --cache .npm --prefer-offline
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

# ---------- lint ----------
lint:
  stage: lint
  image: $NODE_IMAGE
  tags:
    - docker
  only:
    - dev
    - tags
    - merge_requests
  needs: ["install"]
  <<: *node-cache
  script:
    - npm run lint

# ---------- test ----------
test:
  stage: test
  image: $NODE_IMAGE
  tags:
    - docker
  only:
    - dev
    - tags
    - merge_requests
  needs: ["install"]
  <<: *node-cache
  script:
    - npm test
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    paths:
      - coverage/
    reports:
      junit: junit.xml
    expire_in: 1 week

# ---------- build (Vite / no-op for backend) ----------
build:
  stage: build
  image: $NODE_IMAGE
  tags:
    - docker
  only:
    - dev
    - tags
  needs: ["install", "lint", "test"]
  <<: *node-cache
  script:
    # `--if-present` makes this a no-op when package.json has no build script.
    - npm run build --if-present
  artifacts:
    paths:
      - dist/
    expire_in: 1 day

# ---------- docker build & push: dev branch ----------
build-docker-dev:
  stage: build-docker-dev
  image: $DOCKER_IMAGE
  services:
    - docker:24-dind
  tags:
    - docker
  only:
    - dev
  needs: ["test", "build"]
  before_script:
    - echo "$SWR_LOGIN_PASSWORD" | docker login "$SWR_REGISTRY" -u "${SWR_REGION}@${SWR_ACCESS_KEY}" --password-stdin
  script:
    - export IMAGE_TAG="${CI_COMMIT_SHA:0:8}"
    - docker build --pull
        -t $SWR_REGISTRY/$SWR_ORG/$IMAGE_NAME:$IMAGE_TAG
        -t $SWR_REGISTRY/$SWR_ORG/$IMAGE_NAME:dev
        .
    - docker push $SWR_REGISTRY/$SWR_ORG/$IMAGE_NAME:$IMAGE_TAG
    - docker push $SWR_REGISTRY/$SWR_ORG/$IMAGE_NAME:dev

# ---------- docker build & push: tag (release) ----------
build-docker-prod:
  stage: build-docker-prod
  image: $DOCKER_IMAGE
  services:
    - docker:24-dind
  tags:
    - docker
  only:
    - tags
  needs: ["test", "build"]
  before_script:
    - echo "$SWR_LOGIN_PASSWORD" | docker login "$SWR_REGISTRY" -u "${SWR_REGION}@${SWR_ACCESS_KEY}" --password-stdin
  script:
    - docker build --pull
        -t $SWR_REGISTRY/$SWR_ORG/$IMAGE_NAME:v${CI_COMMIT_TAG}
        -t $SWR_REGISTRY/$SWR_ORG/$IMAGE_NAME:latest
        .
    - docker push $SWR_REGISTRY/$SWR_ORG/$IMAGE_NAME:v${CI_COMMIT_TAG}
    - docker push $SWR_REGISTRY/$SWR_ORG/$IMAGE_NAME:latest

# ---------- SonarQube (JS/TS scanner) ----------
sonar:
  stage: sonar
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  tags:
    - docker
  only:
    - dev
    - tags
  needs: ["test"]
  allow_failure: true
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
  script:
    - sonar-scanner
        -Dsonar.projectKey=$CI_PROJECT_NAME
        -Dsonar.sources=src
        -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

# ---------- Container Scanning (Trivy via GitLab template) ----------
include:
  - template: Jobs/Container-Scanning.gitlab-ci.yml

container_scanning:
  stage: container-scanning
  tags:
    - docker
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_TAG'
  variables:
    GIT_STRATEGY: fetch
    CS_REGISTRY_USER: "${SWR_REGION}@${SWR_ACCESS_KEY}"
    CS_REGISTRY_PASSWORD: "${SWR_LOGIN_PASSWORD}"
    TRIVY_USERNAME: "${SWR_REGION}@${SWR_ACCESS_KEY}"
    TRIVY_PASSWORD: "${SWR_LOGIN_PASSWORD}"
  before_script:
    - |
      if [ "$CI_COMMIT_BRANCH" == "dev" ]; then
        export CS_IMAGE="$SWR_REGISTRY/$SWR_ORG/$IMAGE_NAME:${CI_COMMIT_SHA:0:8}"
      else
        export CS_IMAGE="$SWR_REGISTRY/$SWR_ORG/$IMAGE_NAME:v${CI_COMMIT_TAG}"
      fi
