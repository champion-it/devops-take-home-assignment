apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-demo-dev-frontend
  namespace: argocd
  annotations:
    # === argocd-image-updater config ===
    argocd-image-updater.argoproj.io/image-list: |
      frontend=swr.ap-southeast-2.myhuaweicloud.com/devops-demo/devops-frontend
    # Dev: latest image under :latest / dev-<sha> — track by digest.
    argocd-image-updater.argoproj.io/frontend.update-strategy: digest
    argocd-image-updater.argoproj.io/frontend.allow-tags: regexp:^(latest|dev-[a-f0-9]{7,40})$
    argocd-image-updater.argoproj.io/frontend.kustomize.image-name: swr.ap-southeast-2.myhuaweicloud.com/devops-demo/devops-frontend
    argocd-image-updater.argoproj.io/frontend.pull-secret: pullsecret:argocd/swr-pull-secret
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
    argocd-image-updater.argoproj.io/write-back-target: kustomization:overlays/dev/frontend
    argocd-image-updater.argoproj.io/git-branch: main
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: devops-demo
  source:
    repoURL: http://gitlab.dwl.internal/infrastructure/gitops/kustomize-demo.git
    targetRevision: main
    path: overlays/dev/frontend
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
