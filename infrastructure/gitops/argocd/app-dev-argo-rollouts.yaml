apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-tools
  source:
    repoURL: http://gitlab.dwl.internal/infrastructure/gitops/kustomize-demo.git
    targetRevision: main
    path: infrastructure/gitops/tools/argo-rollouts
    helm:
      releaseName: argo-rollouts
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  # CRDs include large schemas; ignore last-applied annotation drift.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/preserveUnknownFields
