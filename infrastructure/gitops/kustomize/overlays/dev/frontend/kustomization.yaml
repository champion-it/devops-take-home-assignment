apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devops-demo

labels:
  - includeSelectors: false
    pairs:
      env: dev
      part-of: devops-takehome

resources:
  - ../../../base/frontend
  - httproute.yaml

configMapGenerator:
  - name: frontend-config
    behavior: merge
    envs:
      - configmap.env

generatorOptions:
  disableNameSuffixHash: true

images:
  - name: swr.ap-southeast-2.myhuaweicloud.com/devops-demo/devops-frontend
    newTag: dev

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: frontend
  - path: hpa-patch.yaml
    target:
      kind: HorizontalPodAutoscaler
      name: frontend
