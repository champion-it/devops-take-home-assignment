{{- if .Values.gateway.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "envoy-gateway.gateway.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "envoy-gateway.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gatewayClass.name }}
  {{- if .Values.gatewayClass.create }}
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ include "envoy-gateway.fullname" . }}-proxy-config
  {{- end }}
  listeners:
  {{- if .Values.gateway.listeners.http.enabled }}
  - name: http
    protocol: HTTP
    port: {{ .Values.gateway.listeners.http.port }}
    allowedRoutes:
      namespaces:
        from: {{ .Values.gateway.listeners.http.allowedRoutesFrom | default "Same" }}
  {{- end }}
  {{- if .Values.gateway.listeners.https.enabled }}
  - name: https
    protocol: HTTPS
    port: {{ .Values.gateway.listeners.https.port }}
    allowedRoutes:
      namespaces:
        from: {{ .Values.gateway.listeners.https.allowedRoutesFrom | default "Same" }}
    tls:
      mode: {{ .Values.gateway.listeners.https.tls.mode }}
      certificateRefs:
      {{- if .Values.gateway.listeners.https.tls.certificateRefs }}
      {{- range .Values.gateway.listeners.https.tls.certificateRefs }}
      - group: ""
        kind: Secret
        name: {{ .name }}
        {{- if .namespace }}
        namespace: {{ .namespace }}
        {{- end }}
      {{- end }}
      {{- else }}
      - group: ""
        kind: Secret
        name: {{ .Values.gateway.listeners.https.tls.certificateRef.name }}
        {{- if .Values.gateway.listeners.https.tls.certificateRef.namespace }}
        namespace: {{ .Values.gateway.listeners.https.tls.certificateRef.namespace }}
        {{- end }}
      {{- end }}
  {{- end }}
{{- end }}
