{{- range .Values.gateway.referenceGrants }}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  labels:
    {{- include "envoy-gateway.labels" $ | nindent 4 }}
spec:
  from:
    {{- range .from }}
    - group: {{ .group | default "gateway.networking.k8s.io" | quote }}
      kind: {{ .kind | quote }}
      namespace: {{ .namespace | quote }}
    {{- end }}
  to:
    {{- range .to }}
    - group: {{ .group | default "" | quote }}
      kind: {{ .kind | quote }}
      {{- if .name }}
      name: {{ .name }}
      {{- end }}
    {{- end }}
{{- end }}
