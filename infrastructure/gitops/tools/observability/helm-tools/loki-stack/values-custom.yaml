# Project overrides for the loki-stack chart.
# Chart bundles Loki (single-binary) + Grafana Alloy (replaces deprecated
# Promtail) + a copy of kube-prometheus-stack we DISABLE here because the
# project installs its own kps separately with custom alerts and dashboards.
# Install with:
#   helm upgrade --install loki-stack ./helm-tools/loki-stack \
#     -f ./helm-tools/loki-stack/values.custom.yaml \
#     -n monitoring

# ──────────────────────────────────────────────────────────────
# Loki — single-binary, 7-day retention, 10 GiB persistent disk.
# ──────────────────────────────────────────────────────────────
loki:
  deploymentMode: SingleBinary

  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    limits_config:
      retention_period: 168h
      max_query_series: 5000
      # Allow structured metadata (trace_id, span_id) for Loki → Tempo linking.
      allow_structured_metadata: true
    compactor:
      retention_enabled: true
      delete_request_store: filesystem

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      storageClass: csi-disk
      size: 5Gi # was 10Gi (tuned for single-node demo)
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        memory: 512Mi

  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  gateway:
    enabled: false
  test:
    enabled: false
  monitoring:
    selfMonitoring:
      enabled: false
      grafanaAgent:
        installOperator: false
    lokiCanary:
      enabled: false

# ──────────────────────────────────────────────────────────────
# Alloy (DaemonSet) — collects logs from every Pod in the cluster.
#   • Backend Pods (app=backend): parse pino JSON, extract level/service/color,
#     promote `trace_id`/`span_id` as structured metadata so Grafana can link
#     a log line straight into the matching Tempo trace.
#   • Frontend Pods (app=frontend): parse nginx access log via regex; promote
#     HTTP method + status code as labels for filtering.
# ──────────────────────────────────────────────────────────────
alloy:
  enabled: true

  controller:
    type: daemonset

  alloy:
    mounts:
      varlog: true
      dockercontainers: false

    configMap:
      create: true
      content: |
        logging {
          level  = "info"
          format = "logfmt"
        }

        // 1) Discover every Pod in the cluster.
        discovery.kubernetes "pods" {
          role = "pod"
        }

        // 2) Build labels + compute the on-disk log path for each Pod.
        //    kubelet writes to /var/log/pods/<ns>_<pod>_<uid>/<container>/*.log
        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app"]
            target_label  = "app"
          }
          // "job" = "<namespace>/<app>" — easy filter key in Grafana Explore.
          rule {
            source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app"]
            separator     = "/"
            target_label  = "job"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_label_color"]
            target_label  = "color"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            target_label  = "node"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            separator     = "/"
            action        = "replace"
            target_label  = "__path__"
            replacement   = "/var/log/pods/*$1/*.log"
          }
        }

        // 3) Resolve the glob patterns to actual files.
        local.file_match "pod_logs" {
          path_targets = discovery.relabel.pod_logs.output
        }

        // 4) Tail the files; forward into the parse pipeline.
        loki.source.file "pod_logs" {
          targets    = local.file_match.pod_logs.targets
          forward_to = [loki.process.parse.receiver]
        }

        // 5) Strip CRI wrapper, then parse per-app.
        loki.process "parse" {
          forward_to = [loki.write.default.receiver]

          stage.cri {}

          // Backend: pino JSON
          stage.match {
            selector = "{app=\"backend\"}"

            stage.json {
              expressions = {
                level    = "level",
                service  = "service",
                color    = "color",
                msg      = "msg",
                trace_id = "trace_id",
                span_id  = "span_id",
              }
            }
            stage.labels {
              values = {
                level   = "",
                service = "",
                color   = "",
              }
            }
            // trace_id / span_id as structured metadata, not labels — keeps
            // cardinality bounded while still letting Grafana derive a link.
            stage.structured_metadata {
              values = {
                trace_id = "",
                span_id  = "",
              }
            }
          }

          // Frontend: nginx combined access log
          //   <ip> - - [<time>] "<method> <path> HTTP/1.1" <status> <bytes> ...
          stage.match {
            selector = "{app=\"frontend\"}"

            stage.regex {
              expression = "^(?P<remote_ip>\\S+) \\S+ \\S+ \\[[^\\]]+\\] \"(?P<method>\\S+) (?P<path>\\S+)[^\"]*\" (?P<status>\\d+) (?P<bytes>\\d+)"
            }
            stage.labels {
              values = {
                method = "",
                status = "",
              }
            }
          }
        }

        // 6) Push to the bundled Loki Service in the same namespace.
        //    Release name = "loki-stack" → service = loki-stack-loki.
        loki.write "default" {
          endpoint {
            url = "http://loki-stack-loki:3100/loki/api/v1/push"
          }
        }

    resources:
      requests:
        cpu: 30m
        memory: 96Mi
      limits:
        memory: 256Mi

# ──────────────────────────────────────────────────────────────
# Bundled kube-prometheus-stack & RustFS — disabled. We use the standalone
# kps install and filesystem storage in this assignment.
# ──────────────────────────────────────────────────────────────
kube-prometheus-stack:
  enabled: false

rustfs:
  enabled: false
