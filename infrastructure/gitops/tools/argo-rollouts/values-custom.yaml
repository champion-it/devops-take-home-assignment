# Demo overrides for the argo-rollouts Helm chart.
# Merged on top of values.yaml at install time:
#   helm install argo-rollouts ./ -n argo-rollouts -f values-custom.yaml

controller:
  # Single controller is fine for the demo cluster (sub-ENI quota is tight).
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # More verbose logs while debugging the demo. Set to "info" in prod.
  logging:
    level: info
    format: json

dashboard:
  # Enable the dashboard so you can watch Rollouts and click Promote/Abort.
  enabled: true
  # Read-only=false lets the dashboard trigger promote/abort/rollback.
  readonly: false
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  service:
    type: ClusterIP
    port: 3100

# Install CRDs together with the chart so kubectl finds them on first apply.
installCRDs: true

# Don't allow controller to manage Rollouts in namespaces we don't expect.
# Empty list = watch all namespaces (default). Uncomment to scope down:
# namespaced: false
# namespaces:
#   - devops-demo

# Send Prometheus metrics (controller exposes /metrics on :8090 by default).
serviceMonitor:
  enabled: false   # flip to true if Prometheus Operator is installed
  additionalLabels: {}
