# Backend CI/CD — produces image tags that match the argocd-image-updater
# annotations on the dev/prod ArgoCD Applications:
#
#   dev   → strategy=digest, allow-tags=^(blue|green|dev-[a-f0-9]{7,40})$
#   prod  → strategy=semver, allow-tags=^v\d+\.\d+\.\d+$
#
# After this pipeline pushes a new image, argocd-image-updater
# (poll interval: 1m dev / 5m prod) detects it, commits a Kustomize image
# override to `main`, and ArgoCD syncs the cluster. CI does NOT touch the
# gitops repo — write-back is handled in-cluster.

variables:
  IMAGE_NAME: devops-backend
  REGISTRY: swr.ap-southeast-2.myhuaweicloud.com
  REGISTRY_NS: devops-demo
  IMAGE_REPO: $REGISTRY/$REGISTRY_NS/$IMAGE_NAME
  # Use BuildKit for cache mounts; produce OCI manifests.
  DOCKER_BUILDKIT: "1"

stages:
  - test
  - build
  - scan
  - publish

default:
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  before_script:
    - echo "$SWR_PASSWORD" | docker login $REGISTRY -u "$SWR_USERNAME" --password-stdin

# ----------------------------------------------------------------------------
# 1) Unit tests — run on every push.
# ----------------------------------------------------------------------------
unit-test:
  stage: test
  image: golang:1.23
  before_script: []
  services: []
  script:
    - go mod download
    - go test ./... -race -coverprofile=coverage.out
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.out
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ----------------------------------------------------------------------------
# 2) Build image. Tag depends on the trigger:
#    - main branch     → dev-<short-sha>  (consumed by dev environment)
#    - git tag vX.Y.Z  → vX.Y.Z           (consumed by prod environment)
#    - feature branch  → not pushed (build-only smoke test)
# ----------------------------------------------------------------------------
.build-base:
  stage: build
  script:
    - >
      docker buildx build
      --platform linux/amd64
      --cache-from type=registry,ref=$IMAGE_REPO:buildcache
      --cache-to   type=registry,ref=$IMAGE_REPO:buildcache,mode=max
      --label org.opencontainers.image.revision=$CI_COMMIT_SHA
      --label org.opencontainers.image.source=$CI_PROJECT_URL
      --label org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      --tag $IMAGE_REPO:$IMAGE_TAG
      --output type=docker,dest=image.tar
      .
    - docker load -i image.tar
  artifacts:
    paths: [image.tar]
    expire_in: 1 day

build:dev:
  extends: .build-base
  variables:
    IMAGE_TAG: dev-$CI_COMMIT_SHORT_SHA
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build:prod:
  extends: .build-base
  variables:
    IMAGE_TAG: $CI_COMMIT_TAG
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ----------------------------------------------------------------------------
# 3) Security scan — fail the pipeline on HIGH/CRITICAL CVEs before publish.
# ----------------------------------------------------------------------------
trivy-scan:
  stage: scan
  image:
    name: aquasec/trivy:0.56.2
    entrypoint: [""]
  before_script: []
  services: []
  script:
    - trivy --version
    - trivy image --input image.tar --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed --format table
    - trivy image --input image.tar --format sarif --output trivy-report.sarif || true
  artifacts:
    when: always
    paths: [trivy-report.sarif]
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ----------------------------------------------------------------------------
# 4) Publish to SWR. Push the resolved tag; argocd-image-updater takes over.
# ----------------------------------------------------------------------------
.publish-base:
  stage: publish
  script:
    - docker load -i image.tar
    - docker push $IMAGE_REPO:$IMAGE_TAG
    - DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE_REPO:$IMAGE_TAG)
    - echo "Published $DIGEST"

publish:dev:
  extends: .publish-base
  variables:
    IMAGE_TAG: dev-$CI_COMMIT_SHORT_SHA
  environment:
    name: dev
    url: https://api-dev.dwl.internal
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

publish:prod:
  extends: .publish-base
  variables:
    IMAGE_TAG: $CI_COMMIT_TAG
  environment:
    name: prod
    url: https://api.dwl.internal
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
