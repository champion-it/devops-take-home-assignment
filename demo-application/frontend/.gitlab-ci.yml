# Frontend CI/CD — produces image tags that match the argocd-image-updater
# annotations on the dev/prod ArgoCD Applications:
#
#   dev   → strategy=digest, allow-tags=^(latest|dev-[a-f0-9]{7,40})$
#   prod  → strategy=semver, allow-tags=^v\d+\.\d+\.\d+$

variables:
  IMAGE_NAME: devops-frontend
  REGISTRY: swr.ap-southeast-2.myhuaweicloud.com
  REGISTRY_NS: devops-demo
  IMAGE_REPO: $REGISTRY/$REGISTRY_NS/$IMAGE_NAME
  DOCKER_BUILDKIT: "1"

stages:
  - test
  - build
  - scan
  - publish

default:
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  before_script:
    - echo "$SWR_PASSWORD" | docker login $REGISTRY -u "$SWR_USERNAME" --password-stdin

lint-test:
  stage: test
  image: node:20-alpine
  before_script: []
  services: []
  script:
    - npm ci
    - npm run lint
    - npm test -- --watchAll=false --coverage
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

.build-base:
  stage: build
  script:
    - >
      docker buildx build
      --platform linux/amd64
      --cache-from type=registry,ref=$IMAGE_REPO:buildcache
      --cache-to   type=registry,ref=$IMAGE_REPO:buildcache,mode=max
      --label org.opencontainers.image.revision=$CI_COMMIT_SHA
      --tag $IMAGE_REPO:$IMAGE_TAG
      --output type=docker,dest=image.tar
      .
    - docker load -i image.tar
  artifacts:
    paths: [image.tar]
    expire_in: 1 day

build:dev:
  extends: .build-base
  variables:
    IMAGE_TAG: dev-$CI_COMMIT_SHORT_SHA
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build:prod:
  extends: .build-base
  variables:
    IMAGE_TAG: $CI_COMMIT_TAG
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

trivy-scan:
  stage: scan
  image:
    name: aquasec/trivy:0.56.2
    entrypoint: [""]
  before_script: []
  services: []
  script:
    - trivy image --input image.tar --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

.publish-base:
  stage: publish
  script:
    - docker load -i image.tar
    - docker push $IMAGE_REPO:$IMAGE_TAG

publish:dev:
  extends: .publish-base
  variables:
    IMAGE_TAG: dev-$CI_COMMIT_SHORT_SHA
  # Also move :latest pointer (consumed by dev environment).
  after_script:
    - docker tag $IMAGE_REPO:dev-$CI_COMMIT_SHORT_SHA $IMAGE_REPO:latest
    - docker push $IMAGE_REPO:latest
  environment:
    name: dev
    url: https://dev.dwl.internal
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

publish:prod:
  extends: .publish-base
  variables:
    IMAGE_TAG: $CI_COMMIT_TAG
  environment:
    name: prod
    url: https://www.dwl.internal
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
